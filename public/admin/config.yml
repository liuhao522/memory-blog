backend:
  name: github-token
  repo: liuhao522/memory-blog
  branch: main
  token: YOUR_GITHUB_TOKEN_HERE

site_url: https://liuhao522.github.io/memory-blog
media_folder: public/images
public_folder: /memory-blog/images

locale: zh_Hans

collections:
  - name: blog
    label: 文章
    folder: content
    create: true
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    summary: "{{name}} — {{description}}"
    editor:
      preview: false
    fields:
      - { label: 标题, name: name, widget: string }
      - { label: 描述, name: description, widget: string }
      - { label: 分类, name: category, widget: select, options: ["Platform", "Business", "Troubleshooting", "Projects", "Tools"], required: false }
      - { label: 技术栈, name: tech, widget: list, required: false }
      - { label: 日期, name: date, widget: date }
      - { label: 精选, name: featured, widget: boolean, default: false, required: false }
      - { label: 精选摘要, name: highlight, widget: string, required: false }
      - { label: 正文, name: body, widget: markdown }

  - name: settings
    label: 个人设置
    files:
      - label: 个人信息
        name: personal
        file: data/settings.json
        fields:
          - { label: 姓名, name: name, widget: string }
          - { label: 职位, name: title, widget: string }
          - { label: 简介, name: tagline, widget: string }
          - { label: Bio, name: bio, widget: text }
          - { label: GitHub, name: github, widget: string }
          - { label: 邮箱, name: email, widget: string }
          - { label: 手机, name: phone, widget: string }
          - { label: 地址, name: location, widget: string }
