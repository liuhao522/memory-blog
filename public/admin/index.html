<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>内容管理 · Hao Liu</title>
</head>
<body>
<div id="app"></div>
<script>
  // Prevent Decap CMS from auto-initializing before our backend is registered
  window.CMS_MANUAL_INIT = true;
</script>
<script src="https://unpkg.com/decap-cms@^3/dist/decap-cms.js"></script>
<script>
(function() {
// ── Custom GitHub Token Backend for Decap CMS ──
var API = 'https://api.github.com';

function b64(str) {
  return btoa(unescape(encodeURIComponent(str)));
}
function d64(str) {
  return decodeURIComponent(escape(atob(str)));
}

function gh(token, path, opts) {
  opts = opts || {};
  var headers = {
    Authorization: 'token ' + token,
    Accept: 'application/vnd.github.v3+json',
  };
  if (opts.body) {
    headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(opts.body);
  }
  return fetch(API + path, { method: opts.method || 'GET', headers: headers, body: opts.body })
    .then(function(r) {
      if (!r.ok) {
        return r.json().then(function(e) {
          throw new Error('GitHub API: ' + (e.message || r.status));
        });
      }
      var ct = r.headers.get('content-type') || '';
      return ct.includes('json') ? r.json() : r.text();
    });
}

function parseFM(raw) {
  var m = raw.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n([\s\S]*)$/);
  if (!m) {
    // Try without body
    m = raw.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?$/);
    if (!m) return { data: {}, body: raw };
    return { data: parseYaml(m[1]), body: '' };
  }
  return { data: parseYaml(m[1]), body: m[2] };
}

function parseYaml(yaml) {
  var data = {};
  var lines = yaml.split('\n');
  var i = 0;
  while (i < lines.length) {
    var line = lines[i];
    // Skip empty lines and comments
    if (!line.trim() || line.trim()[0] === '#') { i++; continue; }

    // Nested object (metadata)
    var indent = line.search(/\S/);
    if (indent > 0) {
      // Inside a nested block - try to parse as simple key: value
      var nkv = line.trim().match(/^([^:]+):\s*(.*)$/);
      if (nkv) {
        var nk = nkv[1].trim();
        var nv = nkv[2].trim();
        if (!data._nested) data._nested = {};
        data._nested[nk] = coerce(nv);
        // Check if next line is a list (- item)
        var listItems = [];
        while (i + 1 < lines.length && lines[i + 1].trim().match(/^-\s+(.+)$/)) {
          i++;
          listItems.push(lines[i].trim().replace(/^-\s+/, ''));
        }
        if (listItems.length > 0) data._nested[nk] = listItems;
      }
      i++; continue;
    }

    var kv = line.trim().match(/^([^:]+):\s*(.*)$/);
    if (!kv) { i++; continue; }

    var key = kv[1].trim();
    var val = kv[2].trim();

    // Check for list
    if (val === '') {
      var items = [];
      while (i + 1 < lines.length && lines[i + 1].trim().match(/^\s*-\s+(.+)$/)) {
        i++;
        items.push(lines[i].trim().replace(/^\s*-\s+/, ''));
      }
      if (items.length > 0) {
        data[key] = items;
        i++; continue;
      }
      data[key] = '';
      i++; continue;
    }

    data[key] = coerce(val);
    i++;
  }

  // Flatten _nested into main data
  if (data._nested) {
    var n = data._nested;
    delete data._nested;
    for (var nk in n) {
      data[nk] = n[nk];
    }
  }

  return data;
}

function coerce(v) {
  if (v === 'true') return true;
  if (v === 'false') return false;
  if (v === '~' || v === 'null') return null;
  if (/^-?\d+$/.test(v)) return parseInt(v, 10);
  if (/^-?\d+\.\d+$/.test(v)) return parseFloat(v);
  // Remove surrounding quotes
  if ((v[0] === '"' && v[v.length-1] === '"') || (v[0] === "'" && v[v.length-1] === "'")) {
    return v.slice(1, -1);
  }
  return v;
}

function stringifyYaml(data, indent) {
  indent = indent || '';
  var lines = [];
  for (var k in data) {
    var v = data[k];
    if (v === undefined || v === null || v === '') continue;
    if (Array.isArray(v)) {
      lines.push(indent + k + ':');
      v.forEach(function(item) { lines.push(indent + '  - ' + item); });
    } else if (typeof v === 'object') {
      lines.push(indent + k + ':');
      lines.push(stringifyYaml(v, indent + '  '));
    } else {
      lines.push(indent + k + ': ' + v);
    }
  }
  return lines.join('\n');
}

function stringifyFM(meta, body) {
  // Restructure metadata for Decap CMS format
  var fmData = {};
  var nested = {};

  for (var k in meta) {
    if (k === 'body' || k === 'slug' || k === 'path' || k === 'categorySlug' || k === 'readingTime') continue;

    if (k === 'tech' || k === 'featured' || k === 'highlight' || k === 'date' || k === 'type' || k === 'node_type') {
      nested[k] = meta[k];
    } else {
      fmData[k] = meta[k];
    }
  }

  nested.node_type = nested.node_type || 'memory';
  nested.type = nested.type || 'project';
  nested.featured = nested.featured || false;
  nested.highlight = nested.highlight || '';
  nested.date = nested.date || '';

  // Build metadata
  fmData.metadata = nested;

  var front = stringifyYaml(fmData);
  return '---\n' + front + '\n---\n' + (body || '');
}

// ── Backend Class ──
function GitHubTokenBackend(config) {
  // config may be a plain object OR an Immutable Map (depending on Decap CMS version)
  var cfg = (config && typeof config.get === 'function') ? config.get('backend') : (config.backend || config);
  if (!cfg) cfg = config;

  var token = (cfg && typeof cfg.get === 'function') ? cfg.get('token') : cfg.token;
  if (!token || token === 'YOUR_GITHUB_TOKEN_HERE') {
    token = prompt('请输入 GitHub Personal Access Token:');
    if (!token) throw new Error('Token required');
  }

  this.token = token;
  this.repo = (cfg && typeof cfg.get === 'function') ? cfg.get('repo') : cfg.repo;
  this.branch = ((cfg && typeof cfg.get === 'function') ? cfg.get('branch') : cfg.branch) || 'main';
  this.repoPath = '/repos/' + this.repo;
}

GitHubTokenBackend.prototype.authComponent = function() {
  // Token is entered via prompt() in the constructor, no auth UI needed
  return null;
};

GitHubTokenBackend.prototype.authenticate = function() {
  return Promise.resolve({ token: this.token, email: 'cms@local' });
};
GitHubTokenBackend.prototype.logout = function() {};
GitHubTokenBackend.prototype.getToken = function() {
  return Promise.resolve(this.token);
};

GitHubTokenBackend.prototype.entriesByFolder = function(collection, extension) {
  var self = this;
  var folder = typeof collection.get === 'function' ? collection.get('folder') : collection.folder;
  return gh(this.token, this.repoPath + '/contents/' + folder + '?ref=' + this.branch)
    .then(function(files) {
      if (!Array.isArray(files)) {
        // If it's a single file (settings collection), return empty
        return [];
      }
      return Promise.all(
        files.filter(function(f) { return f.type === 'file' && f.name.endsWith('.' + extension); })
        .map(function(f) {
          return gh(self.token, self.repoPath + '/contents/' + f.path + '?ref=' + self.branch)
            .then(function(file) {
              var raw = d64(file.content);
              var parsed = parseFM(raw);
              var meta = parsed.data.metadata || {};

              return {
                slug: f.name.replace('.' + extension, ''),
                path: f.path,
                data: Object.assign({}, parsed.data, meta, { body: parsed.body }),
                body: parsed.body,
              };
            });
        })
      );
    });
};

GitHubTokenBackend.prototype.entriesByFiles = function(collection) {
  var self = this;
  var files = collection.get('files');
  return Promise.all(files.map(function(f) {
    var filePath = f.get('file');
    return gh(self.token, self.repoPath + '/contents/' + filePath + '?ref=' + self.branch)
      .then(function(file) {
        return {
          slug: f.get('name'),
          path: filePath,
          data: JSON.parse(d64(file.content)),
          body: '',
        };
      });
  }));
};

GitHubTokenBackend.prototype.getEntry = function(collection, slug, path) {
  var self = this;
  return gh(this.token, this.repoPath + '/contents/' + path + '?ref=' + this.branch)
    .then(function(file) {
      // Single-file JSON collection
      if (path.endsWith('.json')) {
        return {
          slug: slug,
          path: path,
          data: JSON.parse(d64(file.content)),
          body: '',
        };
      }
      // Markdown blog post
      var raw = d64(file.content);
      var parsed = parseFM(raw);
      var meta = parsed.data.metadata || {};
      return {
        slug: slug,
        path: path,
        data: Object.assign({}, parsed.data, meta, { body: parsed.body }),
        body: parsed.body,
      };
    });
};

GitHubTokenBackend.prototype.persistEntry = function(entry, opts) {
  var self = this;
  var path = entry.path;
  var isJSON = path && path.endsWith('.json');

  var content, filePath;

  if (isJSON) {
    // Settings file
    content = JSON.stringify(entry.data, null, 2) + '\n';
    filePath = path;
  } else {
    // Markdown blog post
    var fmData = {};
    for (var k in entry.data) {
      if (k !== 'body' && k !== 'slug' && k !== 'path') fmData[k] = entry.data[k];
    }

    if (fmData.metadata) {
      // Already has metadata block
    } else {
      // Build metadata from flat fields
      fmData.metadata = {
        node_type: 'memory',
        type: fmData.type || 'project',
        featured: fmData.featured || false,
        highlight: fmData.highlight || '',
        tech: fmData.tech || [],
        date: fmData.date || '',
      };
      delete fmData.type;
    }

    content = stringifyFM(fmData, entry.body);
    filePath = path || ('content/' + entry.slug + '.md');
  }

  var body = {
    message: 'Update ' + filePath + ' via CMS',
    content: b64(content),
    branch: this.branch,
  };

  return gh(this.token, this.repoPath + '/contents/' + filePath + '?ref=' + this.branch)
    .then(function(existing) {
      if (existing && existing.sha) body.sha = existing.sha;
      return gh(self.token, self.repoPath + '/contents/' + filePath, {
        method: 'PUT',
        body: body,
      });
    })
    .catch(function() {
      return gh(self.token, self.repoPath + '/contents/' + filePath, {
        method: 'PUT',
        body: body,
      });
    });
};

GitHubTokenBackend.prototype.deleteEntry = function(collection, slug) {
  var self = this;
  var filePath = collection.get('folder') + '/' + slug + '.' + collection.get('extension');
  return gh(this.token, this.repoPath + '/contents/' + filePath + '?ref=' + this.branch)
    .then(function(file) {
      return gh(self.token, self.repoPath + '/contents/' + filePath, {
        method: 'DELETE',
        body: JSON.stringify({
          message: 'Delete ' + filePath + ' via CMS',
          sha: file.sha,
          branch: self.branch,
        }),
      });
    });
};

// Media stubs
GitHubTokenBackend.prototype.getMedia = function() {
  return Promise.resolve({ files: [], images: [] });
};
GitHubTokenBackend.prototype.persistMedia = function() {
  return Promise.reject(new Error('Upload media directly on GitHub: public/images/'));
};
GitHubTokenBackend.prototype.deleteMedia = function() {
  return Promise.reject(new Error('Delete media directly on GitHub.'));
};

// ── Register Backend ──
CMS.registerBackend('github-token', function(config) {
  return new GitHubTokenBackend(config);
});

// Manual init
CMS.init({
  config: {
    load_config_file: true,
  },
});
})();
</script>
</body>
</html>
